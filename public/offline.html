<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline · Taskhull</title>
		<style>
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				background: #fafafa;
				color: #171717;
			}
			main {
				text-align: center;
				padding: 2rem;
				max-width: 22rem;
			}
			h1 {
				font-size: 1.25rem;
				margin: 0 0 0.5rem;
			}
			p {
				color: #737373;
				margin: 0 0 1.5rem;
				line-height: 1.5;
			}
			button {
				font: inherit;
				padding: 0.6rem 1.2rem;
				border-radius: 0.5rem;
				border: 1px solid #d4d4d4;
				background: #fff;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #0a0a0a;
					color: #fafafa;
				}
				p {
					color: #a3a3a3;
				}
				button {
					background: #171717;
					border-color: #333;
					color: #fafafa;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline</h1>
			<p>
				This page hasn't been opened on this device yet, so there is no saved
				copy. Tasks you already opened are still available from "My tasks".
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
